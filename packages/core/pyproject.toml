[project]
name = "netpulse-core"
version = "1.0.0"
description = "Shared typed domain models for NetPulse"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "netpulse_core"
