name: netpulse

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  timescaledb:
    image: timescale/timescaledb:2.30.2-pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-netpulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  migrate:
    image: ghcr.io/amacneil/dbmate:2.36.0
    command: ["up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-netpulse}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@timescaledb:5432/${POSTGRES_DB:-netpulse}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
      DBMATE_WAIT: "true"
      DBMATE_WAIT_TIMEOUT: 60s
    volumes:
      - ./db/migrations:/db/migrations:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  controller:
    build:
      context: services/controller
    environment:
      NETPULSE_CONTROLLER_OPENFLOW_PORT: "6653"
      NETPULSE_CONTROLLER_REST_HOST: 0.0.0.0
      NETPULSE_CONTROLLER_REST_PORT: "8080"
      NETPULSE_CONTROLLER_STATS_INTERVAL_SECONDS: ${CONTROLLER_STATS_INTERVAL_SECONDS:-5}
    ports:
      - "${CONTROLLER_REST_PORT:-8080}:8080"
    restart: unless-stopped
    logging: *default-logging

  network:
    build:
      context: network
    privileged: true
    environment:
      NETPULSE_NETWORK_CONTROLLER_HOST: controller
      NETPULSE_NETWORK_CONTROLLER_PORT: "6653"
      NETPULSE_NETWORK_TREE_DEPTH: ${NETWORK_TREE_DEPTH:-2}
      NETPULSE_NETWORK_TREE_FANOUT: ${NETWORK_TREE_FANOUT:-2}
      NETPULSE_NETWORK_OVS_DATAPATH: ${NETWORK_OVS_DATAPATH:-user}
      NETPULSE_NETWORK_LINK_BANDWIDTH_MBPS: ${NETWORK_LINK_BANDWIDTH_MBPS:-10}
      NETPULSE_NETWORK_TRAFFIC_ENABLED: ${NETWORK_TRAFFIC_ENABLED:-true}
      NETPULSE_NETWORK_FAULT_ENABLED: ${NETWORK_FAULT_ENABLED:-true}
      NETPULSE_NETWORK_FAULT_PERIOD_SECONDS: ${NETWORK_FAULT_PERIOD_SECONDS:-90}
      NETPULSE_NETWORK_FAULT_DURATION_SECONDS: ${NETWORK_FAULT_DURATION_SECONDS:-30}
      NETPULSE_NETWORK_FAULT_LOSS_PERCENT: ${NETWORK_FAULT_LOSS_PERCENT:-20}
    depends_on:
      controller:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging

  collector:
    build:
      context: .
      dockerfile: services/collector/Dockerfile
    environment:
      NETPULSE_COLLECTOR_CONTROLLER_URL: http://controller:8080
      NETPULSE_COLLECTOR_POLL_INTERVAL_SECONDS: ${COLLECTOR_POLL_INTERVAL_SECONDS:-5}
      NETPULSE_COLLECTOR_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NETPULSE_COLLECTOR_REPOSITORY: ${COLLECTOR_REPOSITORY:-timescale}
      NETPULSE_COLLECTOR_DATABASE_URL: postgresql://${POSTGRES_USER:-netpulse}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@timescaledb:5432/${POSTGRES_DB:-netpulse}
      NETPULSE_COLLECTOR_LINK_CAPACITY_BPS: ${NETPULSE_API_LINK_CAPACITY_BPS:-10000000}
      NETPULSE_COLLECTOR_ALERT_WEBHOOK_URL: ${COLLECTOR_ALERT_WEBHOOK_URL:-}
      NETPULSE_COLLECTOR_ALERT_ROUTES: ${COLLECTOR_ALERT_ROUTES:-}
      NETPULSE_COLLECTOR_ALERT_RETENTION_DAYS: ${COLLECTOR_ALERT_RETENTION_DAYS:-7}
      NETPULSE_COLLECTOR_DETECTION_ENABLED: ${COLLECTOR_DETECTION_ENABLED:-true}
      NETPULSE_COLLECTOR_DETECTION_ALPHA: ${COLLECTOR_DETECTION_ALPHA:-0.2}
      NETPULSE_COLLECTOR_DETECTION_WARMUP_SAMPLES: ${COLLECTOR_DETECTION_WARMUP_SAMPLES:-12}
      NETPULSE_COLLECTOR_DETECTION_WARNING_Z: ${COLLECTOR_DETECTION_WARNING_Z:-3.0}
      NETPULSE_COLLECTOR_DETECTION_CRITICAL_Z: ${COLLECTOR_DETECTION_CRITICAL_Z:-5.0}
      NETPULSE_COLLECTOR_DETECTION_MIN_BPS_DELTA: ${COLLECTOR_DETECTION_MIN_BPS_DELTA:-1000000}
      NETPULSE_COLLECTOR_DETECTION_MIN_SIGMA_BPS: ${COLLECTOR_DETECTION_MIN_SIGMA_BPS:-10000}
      NETPULSE_COLLECTOR_DETECTION_MIN_SIGMA_RATE: ${COLLECTOR_DETECTION_MIN_SIGMA_RATE:-0.005}
      NETPULSE_COLLECTOR_DETECTION_DROP_RATE_FLOOR: ${COLLECTOR_DETECTION_DROP_RATE_FLOOR:-0.02}
      NETPULSE_COLLECTOR_DETECTION_ERROR_RATE_FLOOR: ${COLLECTOR_DETECTION_ERROR_RATE_FLOOR:-0}
      NETPULSE_COLLECTOR_ALERT_RESOLVE_AFTER_SECONDS: ${COLLECTOR_ALERT_RESOLVE_AFTER_SECONDS:-60}
      NETPULSE_COLLECTOR_ALERT_COOLDOWN_SECONDS: ${COLLECTOR_ALERT_COOLDOWN_SECONDS:-120}
      NETPULSE_COLLECTOR_ALERT_OPEN_AFTER_SIGNALS: ${COLLECTOR_ALERT_OPEN_AFTER_SIGNALS:-3}
    depends_on:
      controller:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      NETPULSE_API_HOST: 0.0.0.0
      NETPULSE_API_PORT: "8000"
      NETPULSE_API_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NETPULSE_API_DATABASE_URL: postgresql://${POSTGRES_USER:-netpulse}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@timescaledb:5432/${POSTGRES_DB:-netpulse}
      NETPULSE_API_LINK_CAPACITY_BPS: ${NETPULSE_API_LINK_CAPACITY_BPS:-10000000}
      NETPULSE_API_LINK_CAPACITY_SOURCE: ${NETPULSE_API_LINK_CAPACITY_SOURCE:-configured}
      NETPULSE_API_LIVE_INTERVAL_SECONDS: ${COLLECTOR_POLL_INTERVAL_SECONDS:-5}
      NETPULSE_API_CONTROLLER_URL: http://controller:8080
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging

  web:
    build:
      context: web
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

volumes:
  timescaledb-data:
