[project]
name = "netpulse-controller"
version = "0.1.0"
description = "OS-Ken SDN controller application exposing OpenFlow statistics over REST"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = ["os-ken>=4.2.2,<5"]

[project.scripts]
netpulse-controller = "netpulse_controller.__main__:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "netpulse_controller"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
pretty = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["os_ken.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["netpulse_controller.app"]
disallow_subclassing_any = false
disallow_untyped_decorators = false

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
