[project]
name = "netpulse"
version = "0.1.0"
description = "Real-time SDN network monitoring platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "services/api", "services/collector", "network"]
exclude = ["services/controller"]

[tool.uv.sources]
netpulse-core = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"
src = [
    "packages/core/src",
    "services/api/src",
    "services/collector/src",
    "services/controller/src",
    "network/src",
]
extend-exclude = ["web"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "N",
    "ANN",
    "S",
    "C4",
    "PT",
    "RET",
    "PTH",
    "ASYNC",
    "TID",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
pretty = true
files = [
    "packages/core/src",
    "packages/core/tests",
    "services/api/src",
    "services/api/tests",
    "services/collector/src",
    "services/collector/tests",
    "network/src",
    "network/tests",
]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mininet.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest]
minversion = "9.0"
testpaths = [
    "packages/core/tests",
    "services/api/tests",
    "services/collector/tests",
    "network/tests",
]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]
